name: release

# Publishes to PyPI when a GitHub release is published.
# One-time setup on pypi.org: add a trusted publisher for this repo, workflow release.yml, environment pypi.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
