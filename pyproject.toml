[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mockcrowd"
version = "0.4.0"
description = "An AI population designer: personas with connected traits, grounded in real posts, that can also test your product idea."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Phani Sai Munipalli" }]
keywords = ["personas", "persona-design", "ai-populations", "traits", "multi-agent", "simulation", "product-validation", "llm", "market-research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["certifi>=2024.2.2"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "mcp>=2,<3"]

[project.scripts]
mockcrowd = "mockcrowd.cli:main"

[project.urls]
Homepage = "https://github.com/phanisaimunipalli/mockcrowd"

[tool.hatch.build.targets.wheel]
packages = ["src/mockcrowd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
